version: '3.8'

services:
  hive-metastore:
    image: apache/hive:3.1.3
    container_name: test-hive-metastore
    hostname: hive
    environment:
      - SERVICE_NAME=metastore
      - HIVE_METASTORE_DB_HOST=postgres
      - HIVE_METASTORE_DB_PORT=5432
      - HIVE_METASTORE_DB_NAME=hive
      - HIVE_METASTORE_DB_USER=hive
      - HIVE_METASTORE_DB_PASSWORD=hive
    ports:
      - "9083:9083"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9083"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iceberg-sr-network

  postgres:
    image: postgres:15
    container_name: test-postgres
    hostname: postgres
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive
      POSTGRES_DB: hive
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - iceberg-sr-network

  starrocks-fe:
    image: starrocks/starrocks-fe:3.2
    container_name: test-starrocks-fe
    hostname: starrocks-fe
    environment:
      - HOST_TYPE=FQDN
    ports:
      - "9030:9030"
      - "8030:8030"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9030"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iceberg-sr-network

  starrocks-be:
    image: starrocks/starrocks-be:3.2
    container_name: test-starrocks-be
    hostname: starrocks-be
    environment:
      - HOST_TYPE=FQDN
    ports:
      - "9060:9060"
    depends_on:
      starrocks-fe:
        condition: service_healthy
    networks:
      - iceberg-sr-network

  minio:
    image: minio/minio:latest
    container_name: test-minio
    hostname: minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iceberg-sr-network

networks:
  iceberg-sr-network:
    driver: bridge