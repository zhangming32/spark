[pytest]
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    functional: 功能测试
    aggregation: 聚合测试
    fault_tolerance: 容错测试
    performance: 性能测试
    P1: 优先级P1
    P2: 优先级P2
    P3: 优先级P3

addopts = 
    -v
    --strict-markers
    --tb=short

log_cli = true
log_cli_level = INFO

filterwarnings =
    ignore::DeprecationWarning